apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-config
  namespace: code-review
data:
  # LLM Provider
  #
  LLM_PROVIDER: "ollama"
  
  # Ollama Configuration
  # host.docker.internal works in k3d to reach the Windows host
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "qwen2.5-coder:7b"
  
  # Claude Configuration (model only, key in secret)
  CLAUDE_MODEL: "claude-sonnet-4-20250514"
  
  # OpenAI Configuration (model only, key in secret)
  OPENAI_MODEL: "gpt-4o-mini"
  
  # Application Settings
  DEBUG: "false"
  MAX_CODE_LENGTH: "10000"
  REQUEST_TIMEOUT: "120"
