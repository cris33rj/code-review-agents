apiVersion: v1
kind: Service
metadata:
  name: code-review-frontend
  namespace: code-review
  labels:
    app: code-review-frontend
    app.kubernetes.io/name: code-review-frontend
    app.kubernetes.io/part-of: homelab
spec:
