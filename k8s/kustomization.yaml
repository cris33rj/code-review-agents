apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: code-review

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Add secrets only if the file exists
# kubectl apply -k k8s/ will apply all resources

# Common labels
commonLabels:
  app.kubernetes.io/name: code-review-agents
  app.kubernetes.io/part-of: homelab

# Image configuration (can be overridden)
images:
  - name: homelab-registry:5000/code-review-agents
    newTag: latest
